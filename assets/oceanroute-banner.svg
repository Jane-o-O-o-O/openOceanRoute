<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title description">
  <title id="title">OceanRoute — Independent subsea cable planning</title>
  <desc id="description">An original vector illustration of a subsea cable route over stylized seabed contours. The illustration is decorative, not a project map or a simulation result.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071b2d"/>
      <stop offset="1" stop-color="#12384b"/>
