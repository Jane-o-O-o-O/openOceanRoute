    <path d="M905 380L1020 290C1060 258 1102 287 1146 261L1250 190C1294 159 1350 196 1402 148L1502 72" fill="none" stroke="url(#cable)" stroke-width="4" stroke-linecap="round"/>
    <g fill="#102d40" stroke="#99e6d5" stroke-width="3">
